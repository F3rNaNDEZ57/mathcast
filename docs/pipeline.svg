<svg width="680" height="670" viewBox="0 0 680 670" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The mathcast process from install to finished video</title>
<desc>A one-time machine setup of installing the plugin and running init, followed by a per-lesson chain: put a PDF in inputs, ingest it into an outline which stops for human review, then plan, script, make-video, and finally the rendered MP4 and subtitles.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; font-weight: 500; fill: #1f2328; }
  .ts { font-size: 12px; font-weight: 400; fill: #656d76; }
  .band { fill: none; stroke: #afb8c1; stroke-width: 1; stroke-dasharray: 4 4; }
  .arr { stroke: #656d76; stroke-width: 1.5; fill: none; }
  .n-gray  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
  .n-amber { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
  .n-blue  { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
  .n-teal  { fill: #d6f0ed; stroke: #3aa99a; stroke-width: 1; }
  .n-green { fill: #dafbe1; stroke: #3fb950; stroke-width: 1; }

  @media (prefers-color-scheme: dark) {
    .t  { fill: #e6edf3; }
    .ts { fill: #9198a1; }
    .band { stroke: #3d444d; }
    .arr { stroke: #9198a1; }
    .n-gray  { fill: #21262d; stroke: #3d444d; }
    .n-amber { fill: #3b2300; stroke: #b7791f; }
    .n-blue  { fill: #0d2b50; stroke: #1f6feb; }
    .n-teal  { fill: #0c2f2b; stroke: #2f8578; }
    .n-green { fill: #0f2e1a; stroke: #238636; }
  }
</style>

<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="band" x="40" y="56" width="600" height="98" rx="8"/>
<text class="ts" x="52" y="76">Once per machine</text>

<rect class="n-gray" x="64" y="88" width="250" height="54" rx="4"/>
<text class="t"  x="189" y="108" text-anchor="middle">Install the plugin</text>
<text class="ts" x="189" y="126" text-anchor="middle">marketplace add, install, restart</text>

<line class="arr" x1="314" y1="115" x2="356" y2="115" marker-end="url(#arrow)"/>

<rect class="n-gray" x="356" y="88" width="260" height="54" rx="4"/>
<text class="t"  x="486" y="108" text-anchor="middle">/mathcast:init</text>
<text class="ts" x="486" y="126" text-anchor="middle">probes, offers installs, smoke test</text>

<rect class="band" x="40" y="176" width="600" height="470" rx="8"/>
<text class="ts" x="52" y="196">Once per lesson</text>

<rect class="n-gray" x="140" y="208" width="400" height="48" rx="4"/>
<text class="t"  x="340" y="228" text-anchor="middle">Put a PDF in inputs/</text>
<text class="ts" x="340" y="246" text-anchor="middle">markdown, text or a file of links also work</text>

<line class="arr" x1="340" y1="256" x2="340" y2="276" marker-end="url(#arrow)"/>

<rect class="n-amber" x="140" y="276" width="400" height="66" rx="4"/>
<text class="t"  x="340" y="296" text-anchor="middle">ingest</text>
<text class="ts" x="340" y="314" text-anchor="middle">writes work/lesson/outline.md</text>
<text class="ts" x="340" y="332" text-anchor="middle">STOPS HERE — you read it before anything renders</text>

<line class="arr" x1="340" y1="342" x2="340" y2="362" marker-end="url(#arrow)"/>

<rect class="n-blue" x="140" y="362" width="400" height="48" rx="4"/>
<text class="t"  x="340" y="382" text-anchor="middle">plan</text>
<text class="ts" x="340" y="400" text-anchor="middle">scene split, beats, risks to watch</text>

<line class="arr" x1="340" y1="410" x2="340" y2="430" marker-end="url(#arrow)"/>

<rect class="n-blue" x="140" y="430" width="400" height="48" rx="4"/>
<text class="t"  x="340" y="450" text-anchor="middle">script</text>
<text class="ts" x="340" y="468" text-anchor="middle">the exact spoken narration, word-counted</text>

<line class="arr" x1="340" y1="478" x2="340" y2="498" marker-end="url(#arrow)"/>

<rect class="n-teal" x="140" y="498" width="400" height="60" rx="4"/>
<text class="t"  x="340" y="518" text-anchor="middle">make-video</text>
<text class="ts" x="340" y="536" text-anchor="middle">write scene, render draft, repair errors,</text>
<text class="ts" x="340" y="552" text-anchor="middle">inspect frames, promote to final quality</text>

<line class="arr" x1="340" y1="558" x2="340" y2="578" marker-end="url(#arrow)"/>

<rect class="n-green" x="140" y="578" width="400" height="48" rx="4"/>
<text class="t"  x="340" y="598" text-anchor="middle">Your video</text>
<text class="ts" x="340" y="616" text-anchor="middle">MP4 plus timed subtitles in media/videos/</text>
</svg>
